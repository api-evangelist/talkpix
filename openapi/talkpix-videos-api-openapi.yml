components:
  schemas:
    PutApiV1VideosRequest:
      type: object
      properties:
        image_url:
          type: string
        script:
          type: string
        voice:
          type: string
        language:
          type: string
        webhook_url:
          type: string
    PostVideosResponse:
      type: object
      properties:
        id:
          type: string
          description: Video identifier
        object:
          type: string
          description: '"video"'
        status:
          type: string
          description: Initial status, e.g., "processing"
        video_url:
          type: string
          description: null until completed
        resolution:
          type: string
          description: 720p or 1080p
        mode:
          type: string
          description: script or audio
        credits_reserved:
          type: number
          description: Credits reserved for the render
        credits_charged:
          type: number
          description: Will be set after completion
        created_at:
          type: string
          description: Timestamp of creation
        balance:
          type: number
          description: Remaining account balance
    GetApiV1Videos6C1FResponse:
      type: object
      properties:
        status:
          type: string
          description: queued → processing → completed | failed
        video_url:
          type: string
          description: The MP4, set once completed.
        resolution:
          type: string
          description: 720p or 1080p
        mode:
          type: string
          description: script or audio
        credits_reserved:
          type: number
          description: Reserved when the render started
        credits_charged:
          type: number
          description: Final charge after render finished
        created_at:
          type: string
          description: Timestamp of creation
        balance:
          type: number
          description: Account balance after reservation
        metadata:
          type: object
          description: Echoed back metadata
        error:
          type: object
          description: Error object on failure
    GetVideosIdResponse:
      type: object
      properties:
        status:
          type: string
          description: queued → processing → completed | failed
        video_url:
          type: string
          description: The MP4, set once completed.
        resolution:
          type: string
          description: 720p or 1080p
        mode:
          type: string
          description: script or audio
        credits_reserved:
          type: number
          description: Reserved when the render started
        credits_charged:
          type: number
          description: Final charge after render finished
        created_at:
          type: string
          description: Timestamp of creation
        balance:
          type: number
          description: Account balance after reservation
        metadata:
          type: object
          description: Echoed back metadata
        error:
          type: object
          description: Error object on failure
    GetVideosResponse:
      type: object
      properties:
        object:
          type: string
          description: '"list"'
        data:
          type: array
          description: Array of video objects
        has_more:
          type: boolean
          description: Whether more pages exist
        next_starting_after:
          type: string
          description: Cursor for next page
    PutApiV1VideosResponse:
      type: object
      properties:
        id:
          type: string
        object:
          type: string
        status:
          type: string
        video_url:
          type:
          - string
          - 'null'
        resolution:
          type: string
        mode:
          type: string
        credits_reserved:
          type: integer
        credits_charged:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        balance:
          type: integer
    PostVideosRequest:
      type: object
      properties:
        image_url:
          type: string
          description: Public HTTPS URL of a portrait (≤10 MB)
        image_key:
          type: string
          description: Key returned by POST /uploads
        script:
          type: string
          description: What the person says (script mode)
        voice:
          type: string
          description: Voice id or alias, required with script
        language:
          type: string
          description: Language code, required with script
        voice_prompt:
          type: string
          description: Speaking direction for script mode
        video_prompt:
          type: string
          description: Look‑and‑motion direction
        captions:
          type: boolean
          description: Burn captions into MP4 (script mode only)
        audio_url:
          type: string
          description: Public HTTPS URL of audio file (audio mode)
        audio_key:
          type: string
          description: 'Key returned by POST /uploads with kind: "audio"'
        resolution:
          type: string
          description: '"720p" or "1080p", default 720p'
        webhook_url:
          type: string
          description: Endpoint to receive signed POST when render completes
        metadata:
          type: object
          description: Up to 20 string values echoed back
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
